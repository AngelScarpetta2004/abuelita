<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día Abuelita</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400&display=swap');
        
        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); /* Fondo Lila */
            font-family: 'Poppins', sans-serif;
        }
        .card {
            background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: center; max-width: 400px; width: 85%;
        }
        h1 { font-family: 'Dancing Script', cursive; color: #6a1b9a; font-size: 2.8rem; margin-top: 0; }
        button {
            background-color: #8e24aa; color: white; border: none; padding: 15px 25px; font-size: 1rem;
            border-radius: 50px; cursor: pointer; transition: 0.3s; margin-top: 20px;
            box-shadow: 0 4px 15px rgba(142, 36, 170, 0.4);
        }
        button:hover { background-color: #4a148c; transform: scale(1.05); }
        .hidden { display: none; }
        .show { display: block; animation: fadeIn 1.5s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        p { color: #444; font-size: 1.1rem; line-height: 1.6; margin-top: 20px; }
        .hearts { font-size: 1.5rem; margin-top: 15px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="card">
        <h1>¡Feliz Día, Abuelita! 👑</h1>
        <button id="btn-reveal" onclick="mostrarSorpresa()">Toca aquí para tu sorpresa</button>
        <div id="message" class="hidden">
            <p>Dicen que las abuelas son mamás con un montón de dulce añadido, y tú eres la prueba de ello. Gracias por tu sabiduría, tus abrazos que curan el alma y por ser la raíz llena de amor de nuestra familia. ¡Te amo infinito, feliz día!</p>
            <div class="hearts">🌹💜🌼</div>
        </div>
    </div>

    <script>
        function mostrarSorpresa() {
            document.getElementById('message').classList.remove('hidden');
            document.getElementById('message').classList.add('show');
            document.getElementById('btn-reveal').style.display = 'none';
        }
    </script>
</body>
</html>
